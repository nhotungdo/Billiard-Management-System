version: '3.4'

services:
  billiard.api:
    image: billiardmanagementapi
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DBDefault=Server=sqlserver;Database=BilliardDb;User=sa;Password=Your_password123;TrustServerCertificate=True;
      - JwtSettings__Secret=SuperSecretKeyForBilliardManagementSystem12345
    depends_on:
      sqlserver:
        condition: service_healthy

  billiard.web:
    image: billiardmanagementweb
    build:
      context: .
      dockerfile: Dockerfile.Web
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ApiSettings__BaseAddress=http://billiard.api:8080/api/
    depends_on:
      - billiard.api

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Your_password123
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "Your_password123", "-Q", "SELECT 1", "-C"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
